<style>
  :root {
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --primary-light: #EEF2FF;
    --text-main: #1F2937;
    --text-muted: #6B7280;
    --border: #E5E7EB;
    --bg-card: #FFFFFF;
    --bg-page: #F9FAFB;
    --success: #10B981;
    --error: #EF4444;
    --accent: #06B6D4;
    --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    padding: 18px;
    font-size: 14px;
    line-height: 1.5;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .logo-badge {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4F46E5, #06B6D4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: 700;
    box-shadow: var(--shadow-sm);
  }

  .header-text h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.02em;
  }

  .header-text p {
    font-size: 12px;
    color: var(--text-muted);
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-row {
    display: flex;
    gap: 12px;
  }

  .form-row .form-group {
    flex: 1;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .required {
    color: var(--error);
  }

  input[type="text"],
  input[type="number"],
  input[type="date"],
  input[type="email"],
  select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-main);
    background-color: #FFFFFF;
    transition: all 0.2s ease;
    outline: none;
  }

  input:focus,
  select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .input-icon-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-prefix {
    position: absolute;
    left: 12px;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
  }

  .input-with-prefix {
    padding-left: 28px !important;
  }

  /* Live Estimation Card */
  .preview-card {
    background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 100%);
    border: 1px solid #E0E7FF;
    border-radius: 10px;
    padding: 14px;
    margin: 16px 0;
  }

  .preview-card-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--primary);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .preview-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .preview-metric-box {
    background: rgba(255, 255, 255, 0.8);
    border-radius: 6px;
    padding: 8px;
    text-align: center;
    border: 1px solid rgba(226, 232, 240, 0.8);
  }

  .preview-metric-box .label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .preview-metric-box .value {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
  }

  .btn-submit {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #4F46E5, #4338CA);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-submit:hover:not(:disabled) {
    background: linear-gradient(135deg, #4338CA, #3730A3);
    box-shadow: 0 4px 8px rgba(79, 70, 229, 0.3);
    transform: translateY(-1px);
  }

  .btn-submit:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  /* Spinner */
  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #FFFFFF;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Toast Notification */
  .toast {
    display: none;
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
  }

  .toast.success {
    display: block;
    background-color: #ECFDF5;
    color: #065F46;
    border: 1px solid #A7F3D0;
  }

  .toast.error {
    display: block;
    background-color: #FEF2F2;
    color: #991B1B;
    border: 1px solid #FECACA;
  }
</style>
